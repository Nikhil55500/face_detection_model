[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classroom-face-attendance"
version = "0.1.0"
description = "Consent-based classroom face recognition using OpenCV SFace and YuNet"
requires-python = ">=3.10"
dependencies = [
    "opencv-contrib-python>=4.10.0.84",
    "numpy>=1.26,<3",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
    "cryptography>=42.0",
]

[tool.setuptools.packages.find]
include = ["attendance*"]
